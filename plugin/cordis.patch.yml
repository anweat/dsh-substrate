# The substrate mounts a small early bootstrap row and one reporter row.
#
# It installs the runtime tool-name prefix fallback before later plugin rows,
# and reports the resulting aliases. Entry-id conflicts are still decided
# before any plugin applies, so `dsh-substrate-check` reports them first.
# Installation repair remains an external `dsh-substrate repair` transaction;
# the running plugin exposes only read-only status and conflict reports.
- insert:
    - id: substrate-tool-prefix-bootstrap
      name: '@anweat/dsh-substrate/bootstrap'
    - id: substrate-report
      name: '@anweat/dsh-substrate'
