# The substrate mounts one row, and only one.
#
# It reports what it can see from inside a booted tree. It does not rewrite the
# composition from here: entry-id conflicts are decided before any plugin
# applies, so `dsh-substrate-check` reports them first. Installation repair is
# a separate, external `dsh-substrate repair` transaction; the running plugin
# exposes only read-only status and runtime conflict reports.
- insert:
    - id: substrate-report
      name: '@anweat/dsh-substrate'
